# Hand-curated Q/A eval set for retrieval A/B testing (2026-05-27, v0.8.2-snapshot).
#
# Each question carries `expected_source_ids` — parent source IDs that contain
# the answer. A retrieval hit counts if any of the expected IDs OR any of their
# children appear in the top-k results.
#
# `control: true` marks questions that SHOULD return empty (or low-score).
# Used to measure false-positive rate.
#
# Tags:
#   - vocab_match: query uses same words as the capture (FTS should succeed)
#   - paraphrase: query uses different words for the same concept (FTS will struggle)
#   - synonym: heavier reword
#   - control: no relevant content in brain

