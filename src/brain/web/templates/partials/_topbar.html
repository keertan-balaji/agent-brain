<!-- TOP NAVIGATION BAR -->
<header class="flex justify-between items-center w-full px-gutter h-14 bg-surface border-b border-surface-container-highest relative z-10">
  <div class="flex items-center gap-8">
    <div class="font-headline-md text-headline-md text-on-surface font-bold uppercase tracking-tight">
      {% block page_title %}{% endblock %}
    </div>
  </div>
  <div class="flex items-center gap-4">
    {% block topbar_meta %}{% endblock %}
    <div class="h-8 w-[1px] bg-surface-container-highest"></div>
    <button class="p-2 hover:bg-surface-container-high text-on-surface-variant transition-colors rounded">
      <span class="material-symbols-outlined">terminal</span>
    </button>
    <button class="p-2 hover:bg-surface-container-high text-on-surface-variant transition-colors rounded relative">
      <span class="material-symbols-outlined">speed</span>
      <span class="absolute top-2 right-2 w-1.5 h-1.5 bg-primary-container rounded-full animate-pulse"></span>
    </button>
    <button class="p-2 hover:bg-surface-container-high text-on-surface-variant transition-colors rounded">
      <span class="material-symbols-outlined">help</span>
    </button>
  </div>
</header>
